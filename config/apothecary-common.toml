[World_Events]
	#Amount of apothecary potions witches can throw before they default back to vanilla potions.
	Witch_Potion_Count = 1
	#Cooldown for witches to be able to throw apothecary potions again after the potion count has been reached in seconds
	Witch_Potion_Cooldown = 5
	#A list of potions witches can throw with formatting as 'modid:potion_id,weight'.
	#Lower weights means rarer potions while higher weights means more common potions, supports modded potions
	configurable_potions = ["apothecary:vulnerable, 10", "apothecary:burning, 10", "apothecary:lightning, 10", "apothecary:wither, 10", "apothecary:corruption, 10", "apothecary:corrosion, 10", "apothecary:confusion, 10", "apothecary:feeble, 15", "apothecary:shuffling, 5"]

	[World_Events.Potion_Sickness]
		#Enable the potion sickness effect, adding a max limit of how many positive effects players can have
		Enable_Potion_Sickness = false
		#Max effects a player can have before they can get potion sickness, any number after this value will cause potion sickness
		Max_Effects = 10
		#Chance that potion sickness will cause chaos every second (in percentage)
		Potion_Sickness_Chance = 0.01
		#A list of harmful effects potion sickness can apply, overwrites the random harmful effects, format as: 'modid:potion_id'.
		Effect_Whitelist = []
		#A list of harmful effects potion sickness cannot apply, format as: 'modid:potion_id'.
		Effect_Blacklist = ["minecraft:levitation", "apothecary:shuffling", "apothecary:reversion", "apothecary:corruption"]
		#Enable potion sickness instantly applying one random negative effect when first applied
		Instant_Effect = false
