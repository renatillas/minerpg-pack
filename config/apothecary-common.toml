# minerpg (pack 1.5.0): Flight and Reach off (creative flight and reach are too strong), the mana potions off (they
# need Iron's Spells, not in the pack), potion sickness off (class spells, affixes and food buffs go past 10 effects).
# minerpg (pack 1.5.7): Magic Shield / Magic Power / Magic Drain off (they only touch vanilla magic damage, never class
# spells); Purification no longer blocks boss and elite debuffs; Extension no longer stretches class, talent and relic
# buffs. Lists: docs/superpowers/specs/2026-11-03-minerpg-mod-audit.md ("Integration audit fixes").
[General]
	#Global toggle to disable this entire mod, client config, stack size, and attributes will still work if this is disabled
	Apothecary_Enabled = true
	#Global toggle to disable all potions from this mod
	Potions_Enabled = true
	#Enable world events (effects being able to occur in the world outside of potions)
	World_Events = true
	#Max stack size of potions
	# Default: 1
	# Range: 1 ~ 64
	Stack_Size = 1
	#Max amount of damage resistance the player can get
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	Max_Damage_Resistance = 1.0
	#Disable ice and fire compat
	Disable = false

	[Potions.Iron_Skin]
		#Enable Iron Skin
		Enable = true
		#Main ingredient used to brew iron skin potions
		Ingredient = "minecraft:iron_block"
		#Armor points provided by iron skin potions
		Armor_Increase = 4

